<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Materiallista</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #f5f2ec;
      --surface:      #ffffff;
      --border:       #e0dbd2;
      --border-strong:#b8b2a8;
      --text:         #1a1816;
      --muted:        #8a847a;
      --accent:       #c0390a;
      --accent-bg:    #fdf0eb;
      --accent-hover: #9e2d07;
      --ink:          #1a1816;
      --ink-text:     #f5f2ec;
      --shadow:       0 1px 3px rgba(0,0,0,.07), 0 6px 20px rgba(0,0,0,.05);
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 48px 24px 80px;
    }

    .page { max-width: 980px; margin: 0 auto; }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 36px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--ink);
      gap: 32px;
    }

    .header-brand h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -.5px;
      line-height: 1;
    }

    .header-brand p {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-top: 5px;
    }

    .header-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 7px;
    }

    .meta-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .meta-row label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      font-weight: 600;
      white-space: nowrap;
    }

    .meta-row input {
      border: none;
      border-bottom: 1px solid var(--border-strong);
      background: transparent;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      color: var(--text);
      padding: 2px 4px;
      text-align: right;
      width: 190px;
      outline: none;
      transition: border-color .15s;
    }

    .meta-row input:focus { border-bottom-color: var(--accent); }

    /* ── Table wrapper ── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; }

    /* Column widths */
    .c-nr    { width: 44px; }
    .c-art   { } /* flex */
    .c-enum  { width: 148px; }
    .c-antal { width: 96px; }
    .c-pris  { width: 128px; }
    .c-tot   { width: 140px; }
    .c-del   { width: 40px; }

    /* Head */
    thead tr { background: var(--ink); }

    thead th {
      color: var(--ink-text);
      font-size: 9.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 13px 12px;
      text-align: left;
      white-space: nowrap;
    }

    thead th.right { text-align: right; }

    /* Body rows */
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .1s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fdfaf6; }

    tbody td { padding: 3px 4px; vertical-align: middle; }

    .num-label {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      padding: 3px 6px;
      user-select: none;
    }

    /* Inputs */
    .ti {
      width: 100%;
      border: none;
      background: transparent;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      color: var(--text);
      padding: 9px 8px;
      outline: none;
      transition: background .12s;
      border-radius: 1px;
    }

    .ti:focus {
      background: var(--accent-bg);
      outline: 1px solid var(--accent);
      outline-offset: -1px;
    }

    .ti.mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      letter-spacing: .4px;
    }

    .ti.r { text-align: right; }

    /* Calculated total cell */
    .tot-cell {
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      font-weight: 500;
      padding-right: 14px;
      white-space: nowrap;
      color: var(--text);
    }

    .tot-cell.empty { color: var(--border-strong); }

    /* Delete button */
    .btn-del {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--muted);
      border-radius: 50%;
      transition: all .13s;
      margin: 0 auto;
    }

    .btn-del:hover { color: var(--accent); background: var(--accent-bg); }
    .btn-del svg { width: 13px; height: 13px; }

    /* Footer summary */
    tfoot tr.sum-row { background: var(--ink); }

    tfoot td {
      padding: 15px 12px;
      color: var(--ink-text);
    }

    .sum-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
      opacity: .55;
    }

    .sum-amount {
      text-align: right;
      padding-right: 14px;
    }

    .sum-currency {
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      opacity: .55;
      margin-bottom: 2px;
      text-align: right;
    }

    .sum-number {
      font-size: 21px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -.5px;
    }

    /* ── Action bar ── */
    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
    }

    .btn-group { display: flex; gap: 10px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 18px;
      border: none;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .2px;
      transition: all .14s;
      border-radius: 2px;
    }

    .btn svg { width: 14px; height: 14px; flex-shrink: 0; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(192,57,10,.3);
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border-strong);
    }

    .btn-ghost:hover { color: var(--text); border-color: var(--text); }

    .row-count {
      font-size: 12px;
      color: var(--muted);
    }

    /* ── Row animation ── */
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-3px); background: var(--accent-bg); }
      to   { opacity: 1; transform: translateY(0);    background: transparent; }
    }

    .row-new { animation: slideIn .28s ease forwards; }

    /* ── Leverantörsbadge ── */
    .c-lev   { width: 64px; }
    .sup-cell { text-align: center; padding: 4px 6px; }

    .sup-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .8px;
      padding: 3px 8px;
      border-radius: 2px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: filter .12s, transform .1s;
      font-family: 'JetBrains Mono', monospace;
      user-select: none;
      white-space: nowrap;
    }

    .sup-badge:hover  { filter: brightness(.93); }
    .sup-badge:active { transform: scale(.95); }

    /* Lev-rubrik tooltip */
    .lev-header { position: relative; cursor: default; }

    .lev-tip {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: #1a1816;
      color: #f5f2ec;
      padding: 9px 13px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      white-space: nowrap;
      z-index: 200;
      line-height: 1.9;
      pointer-events: none;
    }

    .lev-tip::before {
      content: '';
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-bottom-color: #1a1816;
    }

    .lev-header:hover .lev-tip { display: block; }

    /* Spara-indikator */
    #save-ind {
      font-size: 11px;
      color: var(--muted);
      opacity: 0;
      transition: opacity .3s;
    }

    /* Leverantörsuppdelning i footer */
    .supplier-sum-row { background: #f0ede6; }
    .supplier-sum-row td {
      padding: 9px 16px;
      border-top: 1px solid var(--border);
    }

    /* ── Drag handle (i # -cellen) ── */
    .num-label { position: relative; }
    .num-text  { display: block; transition: opacity .12s; }

    .drag-handle {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      opacity: 0;
      color: var(--muted);
      transition: opacity .15s;
    }

    tbody tr:hover .drag-handle { opacity: 1; }
    tbody tr:hover .num-text    { opacity: 0; }
    .drag-handle:active { cursor: grabbing; }
    .drag-handle svg { width: 11px; height: 15px; }

    /* Drag-tillstånd */
    tbody tr.dragging  { opacity: .3; }
    tbody tr.drag-over { box-shadow: inset 0 2px 0 var(--accent); }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--ink-text);
      padding: 10px 22px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .2px;
      border-radius: 2px;
      z-index: 1000;
      white-space: nowrap;
      pointer-events: none;
      animation: toastIn .2s ease;
    }

    .toast-hide {
      opacity: 0 !important;
      transform: translateX(-50%) translateY(5px) !important;
      transition: opacity .25s ease, transform .25s ease !important;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(8px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ── Print ── */
    @media print {
      body { padding: 0; background: #fff; }
      .page { max-width: 100%; }
      .action-bar { display: none; }
      .c-del, .btn-del, .drag-handle { display: none; }
      .table-wrap { box-shadow: none; border: 1px solid #ccc; }
      thead tr, tfoot tr.sum-row {
        background: #1a1816 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .ti { padding: 6px 8px; }
      .header { margin-bottom: 20px; }
      @page { margin: 18mm 14mm; }
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <h1>Materiallista</h1>
        <p>Artiklar &amp; Priskalkyl</p>
      </div>
      <div class="header-meta">
        <div class="meta-row">
          <label>Projekt</label>
          <input id="f-projekt" type="text" placeholder="Projektnamn" />
        </div>
        <div class="meta-row">
          <label>Upprättad&nbsp;av</label>
          <input id="f-namn" type="text" placeholder="Namn" />
        </div>
        <div class="meta-row">
          <label>Datum</label>
          <input id="f-datum" type="date" />
        </div>
      </div>
    </header>

    <!-- Table -->
    <div class="table-wrap">
      <table id="tbl">
        <colgroup>
          <col class="c-nr" />
          <col class="c-art" />
          <col class="c-enum" />
          <col class="c-lev" />
          <col class="c-antal" />
          <col class="c-pris" />
          <col class="c-tot" />
          <col class="c-del" />
        </colgroup>
        <thead>
          <tr>
            <th>#</th>
            <th>Artikel</th>
            <th>E-Nummer</th>
            <th class="lev-header">
              Lev
              <span class="lev-tip">
                <span style="color:#1a56a0">■</span> REX — Rexel<br>
                <span style="color:#c43d0a">■</span> AHL — Ahlsell<br>
                <span style="color:#2a7a42">■</span> ELK — Elektroskandia<br>
                <span style="color:#7b3fa8">■</span> ELB — elbutik.se
              </span>
            </th>
            <th class="right">Antal</th>
            <th class="right">Pris&nbsp;/&nbsp;st&nbsp;(SEK)</th>
            <th class="right">Total&nbsp;pris</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
        <tfoot>
          <tr class="supplier-sum-row" id="supplier-row" style="display:none">
            <td colspan="8" id="supplier-breakdown"></td>
          </tr>
          <tr class="sum-row">
            <td colspan="5"><span class="sum-label">Totalt</span></td>
            <td></td>
            <td class="sum-amount">
              <div class="sum-currency">SEK</div>
              <div class="sum-number" id="grand">0,00</div>
            </td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>

    <!-- Actions -->
    <div class="action-bar">
      <div class="btn-group">
        <button class="btn btn-primary" onclick="addRow()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Lägg till rad
        </button>
        <button class="btn btn-ghost" onclick="window.print()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 6 2 18 2 18 9"/>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <rect x="6" y="14" width="12" height="8"/>
          </svg>
          Skriv ut
        </button>
        <button class="btn btn-ghost" onclick="exportCSV()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Exportera CSV
        </button>
        <button class="btn btn-ghost" id="btn-pdf" onclick="exportPDF()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
          Exportera PDF
        </button>
      </div>
      <div style="display:flex;align-items:center;gap:16px;">
        <span id="save-ind">✓ Sparad</span>
        <span class="row-count" id="rowcount">0 artiklar</span>
        <button class="btn btn-ghost" onclick="clearList()" title="Rensa och börja om">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
          </svg>
          Ny lista
        </button>
      </div>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    let uid = 0;
    let dragSrc = null;
    const undoStack = [];

    const SUPPLIERS = [
      { id: '',    label: '—',   name: '',               color: '#b8b2a8', bg: 'transparent' },
      { id: 'REX', label: 'REX', name: 'Rexel',          color: '#1a56a0', bg: '#ddeafc' },
      { id: 'AHL', label: 'AHL', name: 'Ahlsell',        color: '#c43d0a', bg: '#fde9e2' },
      { id: 'ELK', label: 'ELK', name: 'Elektroskandia', color: '#2a7a42', bg: '#ddf0e4' },
      { id: 'ELB', label: 'ELB', name: 'elbutik.se',     color: '#7b3fa8', bg: '#f0e8fa' },
    ];

    function nextSupplier(badge) {
      const td  = badge.closest('td');
      const idx = (parseInt(td.dataset.supIdx || '0') + 1) % SUPPLIERS.length;
      td.dataset.supIdx = idx;
      applySupplier(badge, td, SUPPLIERS[idx]);
      updateTotals();
      scheduleSave();
    }

    function getRowSup(tr) {
      const td = tr.querySelector('.sup-cell');
      return td ? SUPPLIERS[parseInt(td.dataset.supIdx || '0')] : SUPPLIERS[0];
    }

    function applySupplier(badge, td, sup) {
      badge.textContent       = sup.label;
      badge.style.color       = sup.color;
      badge.style.background  = sup.bg;
      badge.style.borderColor = sup.id ? sup.color + '55' : 'transparent';
      badge.title             = sup.name || 'Klicka för att välja leverantör';
    }

    // ── Skapa rad-element ────────────────────────────────────
    function createRow(id) {
      const tr = document.createElement('tr');
      tr.dataset.uid = id;
      tr.draggable = true;

      tr.innerHTML = `
        <td class="num-label">
          <span class="drag-handle" title="Dra för att sortera">
            <svg viewBox="0 0 10 16" fill="currentColor">
              <circle cx="3" cy="3"  r="1.4"/><circle cx="7" cy="3"  r="1.4"/>
              <circle cx="3" cy="8"  r="1.4"/><circle cx="7" cy="8"  r="1.4"/>
              <circle cx="3" cy="13" r="1.4"/><circle cx="7" cy="13" r="1.4"/>
            </svg>
          </span>
          <span class="num-text"></span>
        </td>
        <td><input class="ti" type="text" placeholder="Artikelnamn…" /></td>
        <td><input class="ti mono" type="text" placeholder="000-000-00" maxlength="20" /></td>
        <td class="sup-cell" data-sup-idx="0">
          <span class="sup-badge" onclick="nextSupplier(this)" title="Klicka för att byta leverantör"
                style="color:#b8b2a8;">—</span>
        </td>
        <td><input class="ti r" type="number" placeholder="0" min="0" step="1" oninput="calc(${id})" /></td>
        <td><input class="ti r" type="number" placeholder="0,00" min="0" step="0.01" oninput="calc(${id})" /></td>
        <td class="tot-cell empty" id="tot-${id}">—</td>
        <td>
          <button class="btn-del" onclick="delRow(this)" title="Ta bort rad">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </td>`;

      // Förhindra drag från input/knappar
      tr.querySelectorAll('input, button').forEach(el => el.draggable = false);

      // ── Drag-and-drop ──
      tr.addEventListener('dragstart', e => {
        dragSrc = tr;
        tr.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', '');
      });

      tr.addEventListener('dragend', () => {
        tr.classList.remove('dragging');
        document.querySelectorAll('#tbody tr').forEach(r => r.classList.remove('drag-over'));
        dragSrc = null;
      });

      tr.addEventListener('dragover', e => {
        if (!dragSrc || tr === dragSrc) return;
        e.preventDefault();
        document.querySelectorAll('#tbody tr').forEach(r => r.classList.remove('drag-over'));
        tr.classList.add('drag-over');
      });

      tr.addEventListener('dragleave', e => {
        if (!tr.contains(e.relatedTarget)) tr.classList.remove('drag-over');
      });

      tr.addEventListener('drop', e => {
        if (!dragSrc || tr === dragSrc) return;
        e.stopPropagation();
        const tbody = document.getElementById('tbody');
        const rows  = [...tbody.querySelectorAll('tr')];
        const si    = rows.indexOf(dragSrc);
        const ti    = rows.indexOf(tr);
        tbody.insertBefore(dragSrc, si < ti ? tr.nextSibling : tr);
        tr.classList.remove('drag-over');
        renum();
        updateTotals();
        scheduleSave();
      });

      // ── Tangentbordsnavigering ──
      const inputs = [...tr.querySelectorAll('input')];
      inputs.forEach((input, idx) => {
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') {
            e.preventDefault();
            const allRows = [...document.querySelectorAll('#tbody tr')];
            const ri = allRows.indexOf(tr);
            if (ri === allRows.length - 1) {
              addRow();
            } else {
              const ni = allRows[ri + 1].querySelectorAll('input');
              (ni[idx] || ni[0]).focus();
            }
          }
          // Tab på sista fältet i sista raden → ny rad
          if (e.key === 'Tab' && !e.shiftKey && idx === inputs.length - 1) {
            const allRows = [...document.querySelectorAll('#tbody tr')];
            if (allRows.indexOf(tr) === allRows.length - 1) {
              e.preventDefault();
              addRow();
            }
          }
        });
      });

      return tr;
    }

    // ── Lägg till rad ────────────────────────────────────────
    function addRow(animate = true) {
      uid++;
      const tr = createRow(uid);
      if (animate) tr.classList.add('row-new');
      document.getElementById('tbody').appendChild(tr);
      renum();
      updateCount();
      if (animate) { tr.querySelector('.ti').focus(); scheduleSave(); }
    }

    // ── Ta bort rad ──────────────────────────────────────────
    function delRow(btn) {
      const tr      = btn.closest('tr');
      const allRows = [...document.getElementById('tbody').querySelectorAll('tr')];
      const idx     = allRows.indexOf(tr);
      const vals    = [...tr.querySelectorAll('input')].map(i => i.value);
      const supIdx  = parseInt(tr.querySelector('.sup-cell')?.dataset.supIdx || '0');

      undoStack.push({ idx, vals, supIdx });
      if (undoStack.length > 20) undoStack.shift();

      tr.style.transition = 'opacity .18s, transform .18s';
      tr.style.opacity    = '0';
      tr.style.transform  = 'translateX(6px)';
      setTimeout(() => { tr.remove(); renum(); updateTotals(); updateCount(); scheduleSave(); }, 190);

      showToast('Rad borttagen — tryck Ctrl+Z för att ångra');
    }

    // ── Ångra (Ctrl+Z) ───────────────────────────────────────
    function undoDelete() {
      if (!undoStack.length) return;
      const { idx, vals, supIdx } = undoStack.pop();

      uid++;
      const tr    = createRow(uid);
      tr.classList.add('row-new');
      const tbody = document.getElementById('tbody');
      const rows  = tbody.querySelectorAll('tr');
      tbody.insertBefore(tr, idx < rows.length ? rows[idx] : null);

      const inputs = tr.querySelectorAll('input');
      vals.forEach((v, i) => { if (inputs[i]) inputs[i].value = v; });

      if (supIdx > 0) {
        const td  = tr.querySelector('.sup-cell');
        const bdg = tr.querySelector('.sup-badge');
        td.dataset.supIdx = supIdx;
        applySupplier(bdg, td, SUPPLIERS[supIdx]);
      }

      calc(uid);
      renum();
      updateTotals();
      updateCount();
      scheduleSave();
      showToast('Rad återställd');
    }

    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
        if (document.activeElement.tagName !== 'INPUT') {
          e.preventDefault();
          undoDelete();
        }
      }
    });

    // ── Beräkna rad-total ────────────────────────────────────
    function calc(id) {
      const tr = document.querySelector(`[data-uid="${id}"]`);
      if (!tr) return;
      const nums  = tr.querySelectorAll('input[type=number]');
      const antal = parseFloat(nums[0].value) || 0;
      const pris  = parseFloat(nums[1].value) || 0;
      const tot   = antal * pris;
      const cell  = document.getElementById('tot-' + id);
      if (!cell) return;
      if (antal > 0 && pris > 0) {
        cell.textContent = fmt(tot);
        cell.classList.remove('empty');
      } else {
        cell.textContent = '—';
        cell.classList.add('empty');
      }
      updateTotals();
    }

    // ── Totalsumma + leverantörsuppdelning ───────────────────
    function updateTotals() {
      let sum = 0;
      const bySup = {};

      document.querySelectorAll('#tbody tr').forEach(tr => {
        const nums = tr.querySelectorAll('input[type=number]');
        if (!nums.length) return;
        const tot = (parseFloat(nums[0].value) || 0) * (parseFloat(nums[1].value) || 0);
        sum += tot;
        const sup = getRowSup(tr);
        if (sup.id) bySup[sup.id] = (bySup[sup.id] || 0) + tot;
      });

      document.getElementById('grand').textContent = fmt(sum);

      const entries   = Object.entries(bySup);
      const supRow    = document.getElementById('supplier-row');
      const breakdown = document.getElementById('supplier-breakdown');

      if (entries.length > 0) {
        supRow.style.display = '';
        breakdown.innerHTML  = entries.map(([id, s]) => {
          const sup = SUPPLIERS.find(x => x.id === id);
          return `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:18px;">
            <span style="width:7px;height:7px;border-radius:50%;background:${sup.color};display:inline-block;flex-shrink:0;"></span>
            <span style="font-size:10.5px;font-weight:700;color:${sup.color};letter-spacing:.5px;">${id}</span>
            <span style="font-size:12px;font-family:'JetBrains Mono',monospace;color:#1a1816;">${fmt(s)}</span>
          </span>`;
        }).join('');
      } else {
        supRow.style.display = 'none';
      }
    }

    // ── Omnumrering ──────────────────────────────────────────
    function renum() {
      document.querySelectorAll('#tbody tr').forEach((tr, i) => {
        const cell = tr.querySelector('.num-text');
        if (cell) cell.textContent = i + 1;
      });
    }

    // ── Antal-etikett ────────────────────────────────────────
    function updateCount() {
      const n = document.querySelectorAll('#tbody tr').length;
      document.getElementById('rowcount').textContent =
        n === 1 ? '1 artikel' : `${n} artiklar`;
    }

    // ── Formatera tal (sv-SE) ────────────────────────────────
    function fmt(n) {
      return n.toLocaleString('sv-SE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // ── Toast-notis ──────────────────────────────────────────
    function showToast(msg) {
      const prev = document.getElementById('toast');
      if (prev) prev.remove();
      const t = document.createElement('div');
      t.id = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => {
        t.classList.add('toast-hide');
        setTimeout(() => t.remove(), 280);
      }, 2500);
    }

    // ── Exportera CSV ────────────────────────────────────────
    function exportCSV() {
      const proj  = document.getElementById('f-projekt').value || 'materiallista';
      const datum = document.getElementById('f-datum').value   || new Date().toISOString().slice(0,10);
      const rows  = [['#','Artikel','E-Nummer','Leverantör','Antal','Pris/st (SEK)','Total pris (SEK)']];

      document.querySelectorAll('#tbody tr').forEach((tr, i) => {
        const inputs = tr.querySelectorAll('input');
        const art    = inputs[0]?.value || '';
        const enum_  = inputs[1]?.value || '';
        const antal  = inputs[2]?.value || '';
        const pris   = inputs[3]?.value || '';
        const sup    = getRowSup(tr).id;
        const tot    = (parseFloat(antal)||0) * (parseFloat(pris)||0);
        rows.push([i+1, art, enum_, sup, antal, pris, tot.toFixed(2)]);
      });

      const csv  = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
      const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
      const a    = document.createElement('a');
      a.href     = URL.createObjectURL(blob);
      a.download = `${proj}-${datum}.csv`;
      a.click();
    }

    // ── Exportera PDF ────────────────────────────────────────
    async function exportPDF() {
      const btn  = document.getElementById('btn-pdf');
      const orig = btn.innerHTML;
      btn.textContent = 'Genererar…';
      btn.disabled = true;

      const proj     = document.getElementById('f-projekt').value || 'Materiallista';
      const namn     = document.getElementById('f-namn').value    || '';
      const datum    = document.getElementById('f-datum').value   || new Date().toISOString().slice(0,10);
      const grandVal = document.getElementById('grand').textContent;
      const fname    = (proj.replace(/\s+/g,'-') + '-' + datum).toLowerCase() + '.pdf';

      const rows = [];
      document.querySelectorAll('#tbody tr').forEach((tr, i) => {
        const inputs  = tr.querySelectorAll('input');
        const antalN  = parseFloat(inputs[2]?.value) || 0;
        const prisN   = parseFloat(inputs[3]?.value) || 0;
        const totN    = antalN * prisN;
        const sup     = getRowSup(tr);
        rows.push({
          n: i+1, art: inputs[0]?.value||'', enr: inputs[1]?.value||'',
          sup, antal: inputs[2]?.value||'', pris: prisN ? fmt(prisN) : '',
          tot: totN > 0 ? fmt(totN) : '—', totN
        });
      });

      // Delsummor per leverantör för PDF
      const bySup = {};
      rows.forEach(r => { if (r.sup.id) bySup[r.sup.id] = (bySup[r.sup.id]||0) + r.totN; });

      const cell = (txt, x='') =>
        `<td style="padding:8px 9px;border-bottom:1px solid #e0dbd2;font-size:12px;${x}">${txt}</td>`;
      const rNum = (txt, x='') => cell(txt, 'text-align:right;font-family:monospace;'+x);

      const rowsHtml = rows.map(r => `<tr>
        ${cell(`<span style="font-size:10px;color:#8a847a;font-family:monospace;">${r.n}</span>`,'text-align:center;width:30px;')}
        ${cell(r.art)}
        ${cell(`<span style="font-family:monospace;font-size:11px;">${r.enr}</span>`)}
        ${cell(r.sup.id
          ? `<span style="display:inline-block;font-size:9px;font-weight:700;letter-spacing:.5px;padding:2px 6px;border-radius:2px;background:${r.sup.bg};color:${r.sup.color};border:1px solid ${r.sup.color}55;">${r.sup.label}</span>`
          : `<span style="color:#ccc;font-size:11px;">—</span>`,
          'text-align:center;')}
        ${rNum(r.antal)} ${rNum(r.pris)} ${rNum(`<strong>${r.tot}</strong>`)}
      </tr>`).join('');

      const supBreakdown = Object.entries(bySup).map(([id, s]) => {
        const sup = SUPPLIERS.find(x => x.id === id);
        return `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:16px;">
          <span style="width:7px;height:7px;border-radius:50%;background:${sup.color};display:inline-block;flex-shrink:0;"></span>
          <span style="font-size:9px;font-weight:700;color:${sup.color};">${id}</span>
          <span style="font-size:11px;font-family:monospace;">${fmt(s)}</span>
        </span>`;
      }).join('');

      const metaHtml = [
        proj  && `<div><span style="color:#8a847a;font-size:9px;text-transform:uppercase;letter-spacing:1px;">Projekt</span>&nbsp;&nbsp;<strong>${proj}</strong></div>`,
        namn  && `<div><span style="color:#8a847a;font-size:9px;text-transform:uppercase;letter-spacing:1px;">Upprättad av</span>&nbsp;&nbsp;<strong>${namn}</strong></div>`,
        datum && `<div><span style="color:#8a847a;font-size:9px;text-transform:uppercase;letter-spacing:1px;">Datum</span>&nbsp;&nbsp;<strong>${datum}</strong></div>`,
      ].filter(Boolean).join('');

      const th  = t => `<th style="background:#1a1816;color:#f5f2ec;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;padding:10px 9px;text-align:left;white-space:nowrap;">${t}</th>`;
      const thr = t => `<th style="background:#1a1816;color:#f5f2ec;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;padding:10px 9px;text-align:right;white-space:nowrap;">${t}</th>`;

      const html = `<div style="font-family:Arial,sans-serif;padding:0;color:#1a1816;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #1a1816;padding-bottom:14px;margin-bottom:22px;">
          <div>
            <div style="font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1;">Materiallista</div>
            <div style="font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:#8a847a;margin-top:4px;">Artiklar &amp; Priskalkyl</div>
          </div>
          <div style="text-align:right;font-size:12px;line-height:1.7;">${metaHtml}</div>
        </div>
        <table style="width:100%;border-collapse:collapse;">
          <thead><tr>${th('#')}${th('Artikel')}${th('E-Nummer')}${th('Lev')}${thr('Antal')}${thr('Pris / st (SEK)')}${thr('Total pris')}</tr></thead>
          <tbody>${rowsHtml}</tbody>
          <tfoot>
            ${supBreakdown ? `<tr><td colspan="7" style="background:#f0ede6;padding:9px 12px;">${supBreakdown}</td></tr>` : ''}
            <tr>
              <td colspan="5" style="background:#1a1816;color:#f5f2ec;padding:12px 10px;">
                <span style="font-size:9px;text-transform:uppercase;letter-spacing:1.5px;opacity:.55;">Totalt</span>
              </td>
              <td style="background:#1a1816;"></td>
              <td style="background:#1a1816;text-align:right;padding-right:10px;color:#f5f2ec;">
                <div style="font-size:9px;text-transform:uppercase;letter-spacing:1.5px;opacity:.55;margin-bottom:2px;">SEK</div>
                <div style="font-size:18px;font-weight:700;font-family:monospace;">${grandVal}</div>
              </td>
            </tr>
          </tfoot>
        </table>
      </div>`;

      const el = document.createElement('div');
      el.style.cssText = 'position:fixed;left:-9999px;top:0;width:750px;background:#fff;padding:20px;';
      el.innerHTML = html;
      document.body.appendChild(el);

      await html2pdf().set({
        margin: [14,12], filename: fname,
        image: { type:'jpeg', quality:.98 },
        html2canvas: { scale:2, useCORS:true, backgroundColor:'#fff' },
        jsPDF: { unit:'mm', format:'a4', orientation:'portrait' }
      }).from(el).save();

      document.body.removeChild(el);
      btn.innerHTML = orig;
      btn.disabled  = false;
    }

    // ── localStorage ────────────────────────────────────────
    let saveTimer = null;

    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveToStorage, 500);
    }

    function saveToStorage() {
      const meta = {
        projekt: document.getElementById('f-projekt').value,
        namn:    document.getElementById('f-namn').value,
        datum:   document.getElementById('f-datum').value,
      };
      const rows = [];
      document.querySelectorAll('#tbody tr').forEach(tr => {
        const inputs = tr.querySelectorAll('input');
        rows.push({
          art:    inputs[0]?.value || '',
          enr:    inputs[1]?.value || '',
          supIdx: parseInt(tr.querySelector('.sup-cell')?.dataset.supIdx || '0'),
          antal:  inputs[2]?.value || '',
          pris:   inputs[3]?.value || '',
        });
      });
      localStorage.setItem('matriallista-v1', JSON.stringify({ meta, rows }));
      const ind = document.getElementById('save-ind');
      if (ind) {
        ind.style.opacity = '1';
        clearTimeout(ind._t);
        ind._t = setTimeout(() => { ind.style.opacity = '0'; }, 1800);
      }
    }

    function loadFromStorage() {
      try {
        const raw = localStorage.getItem('matriallista-v1');
        if (!raw) return false;
        const { meta, rows } = JSON.parse(raw);
        if (meta) {
          document.getElementById('f-projekt').value = meta.projekt || '';
          document.getElementById('f-namn').value    = meta.namn    || '';
          if (meta.datum) document.getElementById('f-datum').value = meta.datum;
        }
        if (rows?.length) {
          rows.forEach(r => {
            uid++;
            const tr = createRow(uid);
            document.getElementById('tbody').appendChild(tr);
            const inputs = tr.querySelectorAll('input');
            inputs[0].value = r.art   || '';
            inputs[1].value = r.enr   || '';
            inputs[2].value = r.antal || '';
            inputs[3].value = r.pris  || '';
            if (r.supIdx > 0 && r.supIdx < SUPPLIERS.length) {
              const td  = tr.querySelector('.sup-cell');
              const bdg = tr.querySelector('.sup-badge');
              td.dataset.supIdx = r.supIdx;
              applySupplier(bdg, td, SUPPLIERS[r.supIdx]);
            }
            calc(uid);
          });
          renum();
          updateTotals();
          updateCount();
        }
        return rows?.length > 0;
      } catch(e) { return false; }
    }

    function clearList() {
      if (!confirm('Rensa hela listan och börja om?')) return;
      document.getElementById('tbody').innerHTML = '';
      document.getElementById('f-projekt').value = '';
      document.getElementById('f-namn').value    = '';
      document.getElementById('f-datum').valueAsDate = new Date();
      localStorage.removeItem('matriallista-v1');
      addRow(false); addRow(false); addRow(false);
      renum(); updateTotals(); updateCount();
    }

    // Spara vid varje input-händelse i tabellen och meta-fälten
    document.getElementById('tbody').addEventListener('input', scheduleSave);
    document.querySelector('.header-meta').addEventListener('input', scheduleSave);

    // ── Init ─────────────────────────────────────────────────
    const restored = loadFromStorage();
    if (!restored) {
      document.getElementById('f-datum').valueAsDate = new Date();
      addRow(false);
      addRow(false);
      addRow(false);
    }
  </script>
</body>
</html>
